services:
  mysql:
    image: mysql:8.4
    container_name: ai-chat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_chat
      MYSQL_USER: ai_chat_user
      MYSQL_PASSWORD: ai_chat_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: